<div class="pending-payment-history-container">
    <mat-card class="pending-payment-history-card">
        <mat-card-title class="title">Historial de pagos</mat-card-title>
        <mat-card-content>
            <p>Aquí puedes consultar el estado de los pagos</p>

            <div class="form-row">
                <button mat-raised-button color="primary" class="submit-btn" (click)="consultarDatos()">
                    Consultar
                </button>
            </div>

            <!-- Filtros -->
            <div class="filtros">
                <mat-form-field appearance="fill">
                    <mat-label>ID</mat-label>
                    <input matInput [(ngModel)]="filtros.Id" (input)="aplicarFiltros()" placeholder="Buscar ID">
                </mat-form-field>

                <mat-form-field appearance="fill">
                    <mat-label>Usuario</mat-label>
                    <input matInput [(ngModel)]="filtros.Usuario" (input)="aplicarFiltros()"
                        placeholder="Buscar nombre">
                </mat-form-field>

                <mat-form-field appearance="fill">
                    <mat-label>Estacionamiento</mat-label>
                    <input matInput [(ngModel)]="filtros.Estacionamiento" (input)="aplicarFiltros()"
                        placeholder="Buscar dirección">
                </mat-form-field>

                <mat-form-field appearance="fill">
                    <mat-label>Tipo de pago</mat-label>
                    <input matInput [(ngModel)]="filtros.TipoPago" (input)="aplicarFiltros()" placeholder="Buscar tipo">
                </mat-form-field>

                <mat-form-field appearance="fill">
                    <mat-label>Estado</mat-label>
                    <input matInput [(ngModel)]="filtros.Estado" (input)="aplicarFiltros()" placeholder="true/false">
                </mat-form-field>
            </div>

            <!-- Tabla -->
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                <!-- ID -->
                <ng-container matColumnDef="Id">
                    <th mat-header-cell *matHeaderCellDef>ID</th>
                    <td mat-cell *matCellDef="let element">{{ element.Id }}</td>
                </ng-container>

                <!-- Usuario -->
                <ng-container matColumnDef="Usuario">
                    <th mat-header-cell *matHeaderCellDef>Usuario</th>
                    <td mat-cell *matCellDef="let element">{{ element.Usuario }}</td>
                </ng-container>

                <!-- Estacionamiento -->
                <ng-container matColumnDef="Estacionamiento">
                    <th mat-header-cell *matHeaderCellDef>Estacionamiento</th>
                    <td mat-cell *matCellDef="let element">{{ element.Estacionamiento }}</td>
                </ng-container>

                <!-- Tipo de pago -->
                <ng-container matColumnDef="TipoPago">
                    <th mat-header-cell *matHeaderCellDef>Tipo de pago</th>
                    <td mat-cell *matCellDef="let element">{{ element.TipoPago }}</td>
                </ng-container>

                <!-- Estado -->
                <ng-container matColumnDef="Estado">
                    <th mat-header-cell *matHeaderCellDef>Estado</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.Estado ? 'Pagado' : 'Pendiente' }}
                    </td>
                </ng-container>

                <!-- Filas -->
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </mat-card-content>
    </mat-card>
</div>

<div class="edit-profile-container">
  <div class="main-content">
    <div class="title">Editar Vehículo</div>
    <mat-card-content>
      <form [formGroup]="editForm">
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Tipo del Vehículo</mat-label>
            <input matInput formControlName="vehicleType" placeholder="Ej: Carro, Moto, Bici">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Marca del Vehículo</mat-label>
            <input matInput formControlName="vehicleBrand" placeholder="Ej: Chevrolet, Yamaha">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Modelo del Vehículo</mat-label>
            <input matInput formControlName="vehicleModel" placeholder="Ej: Spark GT, FZ 2.0">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Año del Vehículo</mat-label>
            <input matInput formControlName="vehicleYear" placeholder="Ej: 2022">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Placa del Vehículo</mat-label>
            <input matInput formControlName="vehiclePlate" placeholder="Ej: ABC123">
          </mat-form-field>

          <div class="form-group text-image">
            <label class="custom-file-upload">
              <input type="file" id="profileImage" accept="image/*" (change)="onFileSelected($event)" />
              Foto del Vehículo
            </label>
            <div class="file-name">
              {{ selectedFile?.name || 'Sin archivo seleccionado' }}
            </div>
            <img *ngIf="previewUrl" [src]="previewUrl" alt="Vista previa" class="preview-img" />
          </div>
        </div>

        <div class="form-group">
          <button mat-raised-button color="primary" type="button" class="submit-btn" (click)="update()">
            Actualizar vehículo
          </button>
        </div>
      </form>
    </mat-card-content>
  </div>
</div>

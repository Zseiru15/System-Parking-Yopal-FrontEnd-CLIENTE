<div class="edit-profile-container">

  <app-alerts #alertsComp></app-alerts>

  <div class="main-content">
    <div class="title">Registro de Vehiculo</div>
    <mat-card-content>
      <form [formGroup]="editFrom">
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Tipo del Vehiculo</mat-label>
            <input matInput formControlName="vehicleType" placeholder="Ingrese sus Nombres">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Marca del Vehiculo</mat-label>
            <input matInput formControlName="vehicleBrand" placeholder="Ingrese sus Nombres">
          </mat-form-field>
        </div>
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Modelo del Vehiculo</mat-label>
            <input matInput formControlName="vehicleModel" placeholder="Usuario">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Año del Vehiculo</mat-label>
            <input matInput formControlName="vehicleYear" placeholder="Ingrese sus Apellidos">
          </mat-form-field>
        </div>
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Placa del Vehiculo</mat-label>
            <input matInput formControlName="vehiclePlate" placeholder="Usuario">
          </mat-form-field>
          <div class="form-group text-image">
            <label class="custom-file-upload">
              <input type="file" id="profileImage" accept="image/*" (change)="onFileSelected($event)" />
              Foto de Perfil
            </label>
            <div class="file-name">
              {{ selectedFile?.name || 'Sin archivo seleccionado' }}
            </div>
            <img *ngIf="previewUrl" [src]="previewUrl" alt="Vista previa" class="preview-img" />
          </div>
        </div>
        <div class="form-group">
          <button mat-raised-button color="primary" type="submit" class="submit-btn" (click)="editprofile()">Registrar
            vehiculo</button>
        </div>
      </form>
    </mat-card-content>
  </div>
</div>

<div class="register-container">
  <mat-card class="register-card">
    <mat-card class="register-form">
      <h1 class="title">Registro</h1>

      <div class="user-type">
        <button type="button" class="user-btn active">Usuario</button>
        <button type="button" class="admin-btn">Administrador</button>
      </div>

      <mat-card-content>
        <form [formGroup]="registerForm" (ngSubmit)="register()">
          <div class="form-group">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Nombres</mat-label>
              <input matInput formControlName="firstName" placeholder="Ingrese sus nombres">
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Apellidos</mat-label>
              <input matInput formControlName="lastName" placeholder="Ingrese sus apellidos">
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Numero de identidad</mat-label>
              <input matInput formControlName="documentNumber" placeholder="Numero de identidad">
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Correo electronico</mat-label>
              <input matInput formControlName="email" placeholder="Correo electronico">
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Contraseña</mat-label>
              <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Contraseña">
              <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
                <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>
          </div>
          <div class="form-group">
            <button mat-raised-button color="primary" type="submit" class="submit-btn"
              (click)="goToDashboard()">Registrarme</button>
          </div>
          <!-- Enlaces para recuperar contraseña y crear cuenta -->
          <div class="actions">
            <button class="session" mat-button color="accent" (click)="goToLogin()">¿Ya tienes una cuenta? Inicia
              sesión</button>
            <button class="terms-condit" mat-button color="warn" (click)="register()">Términos y condiciones</button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </mat-card>
</div>

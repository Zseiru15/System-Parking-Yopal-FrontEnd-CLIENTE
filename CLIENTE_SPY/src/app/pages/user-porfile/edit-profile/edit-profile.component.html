<div class="edit-profile-container">

  <app-alerts #alertsComp></app-alerts>

  <div class="main-content">
    <div class="title">Editar Datos</div>
    <mat-card-content>
      <form [formGroup]="editFrom">
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nombres</mat-label>
            <input matInput formControlName="firstName" placeholder="Ingrese sus Nombres">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Apellidos</mat-label>
            <input matInput formControlName="lastName" placeholder="Ingrese sus Apellidos">
          </mat-form-field>
        </div>
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Numero de identidad</mat-label>
            <input matInput formControlName="documentNumber" placeholder="Numero de identidad">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Telefono</mat-label>
            <input matInput formControlName="documentNumber" placeholder="Numero de identidad">
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Correo electronico</mat-label>
            <input matInput formControlName="email" placeholder="Correo electronico">
          </mat-form-field>
        </div>
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
              placeholder="Contraseña">
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>
          <div class="form-group text-image">
            <label class="custom-file-upload">
              <input type="file" id="profileImage" accept="image/*" (change)="onFileSelected($event)" /> Foto de Perfil </label>
            <div class="file-name">
              {{ selectedFile?.name || 'Sin archivo seleccionado' }}
            </div>
            <img *ngIf="previewUrl" [src]="previewUrl" alt="Vista previa" class="preview-img" />
          </div>
        </div>
        <div class="form-group">
          <button mat-raised-button color="primary" type="submit" class="submit-btn" (click)="editprofile()">Guardar
            Cambios</button>
        </div>
      </form>
    </mat-card-content>
  </div>
</div>

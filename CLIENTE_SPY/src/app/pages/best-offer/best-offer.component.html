<div class="best-offer-container">
    <mat-card class="best-offer-card">
        <mat-card class="best-offer-form">
            <h1 class="title">Crear Oferta</h1>
            <span class="text">Esta seccion permitira a los administradores registrar las ofertas</span>
            <mat-card-content>
                <form [formGroup]="bestofferForm" (ngSubmit)="bestoffer()">
                    <div class="form-group">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Descrpción</mat-label>
                            <input matInput formControlName="description" placeholder="Descrpción">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Tiempo de la oferta</mat-label>
                            <input matInput formControlName="schedule" placeholder="08:00 - 20:00">
                        </mat-form-field>
                    </div>
                    <h1 class="title">Cupos</h1>
                    <div class="form-row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Carros</mat-label>
                            <input matInput formControlName="cars" placeholder="10">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Valor</mat-label>
                            <input matInput formControlName="valorCars" placeholder="10">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Descuento</mat-label>
                            <input matInput formControlName="discountCars" placeholder="10">
                        </mat-form-field>
                    </div>

                    <div class="form-row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Motos</mat-label>
                            <input matInput formControlName="motorcycles" placeholder="10">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Valor</mat-label>
                            <input matInput formControlName="valorMotorcycles" placeholder="10">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Descuento</mat-label>
                            <input matInput formControlName="discountMotorcycles" placeholder="10">
                        </mat-form-field>
                    </div>

                    <div class="form-row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Bicicletas</mat-label>
                            <input matInput formControlName="bicycles" placeholder="10">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Valor</mat-label>
                            <input matInput formControlName="valorBicycles" placeholder="10">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Descuento</mat-label>
                            <input matInput formControlName="discountBicycles" placeholder="10">
                        </mat-form-field>
                    </div>
                    <button mat-raised-button color="primary" class="submit-btn" (click)="bestoffer()">Crear Oferta</button>
                </form>
            </mat-card-content>
        </mat-card>
    </mat-card>
</div>

<div class="best-offer-container">
    <mat-card class="best-offer-card">
        <mat-card class="best-offer-form">
            <h1 class="title">Crear Oferta</h1>
            <span class="text">Esta seccion permitira a los administradores registrar las ofertas</span>
            <mat-card-content>
                <form [formGroup]="bestofferForm" (ngSubmit)="bestoffer()">
                    <div class="form-group">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Nombre del Estacionamiento</mat-label>
                            <mat-select formControlName="parkingName" placeholder="Nombre del estacionamiento">
                                <mat-option value="parqueadero1">Parqueadero 1</mat-option>
                                <mat-option value="parqueadero2">Parqueadero 1</mat-option>
                            </mat-select>
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Coordenadas del parqueadero</mat-label>
                            <input matInput formControlName="coordinates" placeholder="5°19'29.2''N 72°23'22.1''W">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Direccion del parqueadero</mat-label>
                            <input matInput formControlName="address" placeholder="Cra. 19 #36-92 Yopal, Casanare">
                        </mat-form-field>
                    </div>
                    <h1 class="title">Cupos</h1>
                    <div class="form-row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Carros</mat-label>
                            <input matInput formControlName="cars" placeholder="10">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Motos</mat-label>
                            <input matInput formControlName="motorcycles" placeholder="10">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Bisis</mat-label>
                            <input matInput formControlName="bicycles" placeholder="10">
                        </mat-form-field>
                    </div>
                    <h1 class="title">Caracteristicas</h1>
                    <div class="form-row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Precio por hora</mat-label>
                            <input matInput formControlName="price" placeholder="1.000">
                        </mat-form-field>
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Horario</mat-label>
                            <input matInput formControlName="schedule" placeholder="08:00 - 20:00">
                        </mat-form-field>
                    </div>
                    <button mat-raised-button color="primary" class="submit-btn" (click)="bestoffer()">Crear Oferta</button>
                </form>
            </mat-card-content>
        </mat-card>
    </mat-card>
</div>

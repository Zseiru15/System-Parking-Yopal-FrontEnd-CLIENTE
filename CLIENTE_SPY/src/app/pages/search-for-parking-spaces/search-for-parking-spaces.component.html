<div class="search-for-parking-space-container">
  <mat-card class="search-for-parking-space-card">
    <mat-card-title class="title">Búsqueda de Parqueaderos</mat-card-title>
    <mat-card-content>
      <p class="description">Aquí puede consultar los parqueaderos de su interés.</p>

      <!-- Botones principales -->
      <div class="form-row">
        <button mat-raised-button color="warn" class="submit-btn" (click)="limpiarFiltros()">Limpiar filtros</button>
      </div>

      <!-- Filtros -->
      <div class="filtros">
        <mat-form-field appearance="fill">
          <mat-label>Nombre</mat-label>
          <input matInput [(ngModel)]="filtros.Nombres" (input)="aplicarFiltros()" placeholder="Buscar por nombre" />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Dirección</mat-label>
          <input matInput [(ngModel)]="filtros.Direccion" (input)="aplicarFiltros()"
            placeholder="Buscar por dirección" />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Descripción</mat-label>
          <input matInput [(ngModel)]="filtros.Descripcion" (input)="aplicarFiltros()"
            placeholder="Buscar por descripción" />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Estado</mat-label>
          <mat-select [(ngModel)]="filtros.Estado" (selectionChange)="aplicarFiltros()">
            <mat-option value="">Todos</mat-option>
            <mat-option value="true">Activo</mat-option>
            <mat-option value="false">Inactivo</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Tabla de resultados -->
      <div class="tabla-scroll-responsive">
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let element">{{ element.Nombres }}</td>
          </ng-container>

          <ng-container matColumnDef="direccion">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Dirección</th>
            <td mat-cell *matCellDef="let element">{{ element.Direccion }}</td>
          </ng-container>

          <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
            <td mat-cell *matCellDef="let element">{{ element.Descripcion }}</td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
            <td mat-cell *matCellDef="let element">
              <span [ngClass]="element.Estado ? 'activo' : 'inactivo'">
                {{ element.Estado ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef> Perfil </th>
            <td mat-cell *matCellDef="let row">
              <button mat-raised-button color="accent" class="submit-btn" (click)="parqueaderoSeleccionado(row)">
                Ver Perfil
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

      <!-- Paginador -->
      <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
  <!-- Vista Dinámica como Overlay -->
  <div class="overlay" *ngIf="vistaSeleccionada === 'profileparqueadero'">
    <div class="overlay-content">
      <button mat-icon-button color="warn" class="close-btn" (click)="cerrarVista()">✕</button>
      <app-parking-profile [parqueadero]="profileparqueadero"></app-parking-profile>
    </div>
  </div>
</div>

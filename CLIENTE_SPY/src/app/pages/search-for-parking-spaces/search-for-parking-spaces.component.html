<div class="search-for-parking-space-container">
  <mat-card class="search-for-parking-space-card">
    <mat-card-title class="title">Busqueda de Parqueaderos</mat-card-title>
    <mat-card-content>
      <p>Aqui pueden realizar la consulta de su parqueaderos de interes</p>
      <div class="form-row">
        <div class="form-row">
          <button mat-raised-button color="primary" class="submit-btn" (click)="consultarDatos()">Consultar</button>
        </div>
      </div>

      <div class="filtros">
        <mat-form-field apparent="fill">
          <mat-label>id</mat-label>
          <input matInput [(ngModel)]="filtros.Id" (input)="aplicarFiltros()" placeholder="Buscar Id">
        </mat-form-field>
        <mat-form-field apparent="fill">
          <mat-label>nombre</mat-label>
          <input matInput [(ngModel)]="filtros.Nombres" (input)="aplicarFiltros()" placeholder="Buscar Nombre">
        </mat-form-field>
        <mat-form-field apparent="fill">
          <mat-label>direccion</mat-label>
          <input matInput [(ngModel)]="filtros.Direccion" (input)="aplicarFiltros()" placeholder="Buscar Direccion">
        </mat-form-field>
        <mat-form-field apparent="fill">
          <mat-label>descripcion</mat-label>
          <input matInput [(ngModel)]="filtros.Descripcion" (input)="aplicarFiltros()" placeholder="Buscar Valor">
        </mat-form-field>
        <mat-form-field apparent="fill">
          <mat-label>estado</mat-label>
          <input matInput [(ngModel)]="filtros.Estado" (input)="aplicarFiltros()" placeholder="true/false">
        </mat-form-field>
      </div>

      <table mat-table [dataSource]="datafilter" class="mat-elevation-z8">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>id</th>
          <td mat-cell *matCellDef="let element">{{element.Id}}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>nombre</th>
          <td mat-cell *matCellDef="let element">{{element.Nombres}}</td>
        </ng-container>

        <ng-container matColumnDef="direccion">
          <th mat-header-cell *matHeaderCellDef>direccion</th>
          <td mat-cell *matCellDef="let element">{{element.Direccion}}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>descripcion</th>
          <td mat-cell *matCellDef="let element">{{element.Descripcion}}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>estado</th>
          <td mat-cell *matCellDef="let element">{{element.Estado}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>

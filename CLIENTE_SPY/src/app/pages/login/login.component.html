<div class="login-session">

  <app-alerts #alertsComp></app-alerts>

  <mat-card class="login-container">
    <mat-card class="login-form">
      <h1 class="title">Iniciar Sesion</h1>
      <p class="subtitle">Ingrese sus credenciales para continuar</p>

      <mat-card class="login-form" [formGroup]="loginForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electronico</mat-label>
          <input matInput formControlName="email" placeholder="Correo electronico">
        </mat-form-field>
        <!-- Campo de Contraseña -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
            placeholder="Ingrese su contraseña">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <!-- Botón de Ingreso -->
        <button mat-raised-button color="primary" class="submit-btn" (click)="login()">Iniciar Sesión</button>
      </mat-card>

      <!-- Enlaces para recuperar contraseña y crear cuenta -->
      <div class="actions">
        <button class="recover-password" mat-button color="accent" (click)="recoverPassword()">¿Olvidaste tu
          contraseña?</button>
        <button class="create-account" mat-button color="warn" (click)="goToRegister()">Crear cuenta nueva</button>
      </div>
    </mat-card>
  </mat-card>
</div>
